# Music-study fork: build the Windows installer on demand.
# Actions → "Windows installer (music fork)" → Run workflow. The installer
# (LearnHarness-Setup-*.exe) is attached to the run as an artifact.
name: Windows installer (music fork)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
      - run: npm ci
      - run: npm run plugins:setup
      - run: npm run build
      - run: node scripts/smoke-provider-runtime.mjs
      - run: node scripts/build-server.mjs
      - run: node scripts/smoke-server.mjs --electron
      - run: npx electron-builder --win --x64 --publish never
      - name: Save the installer
        uses: actions/upload-artifact@v7
        with:
          name: learnharness-music-windows-x64
          retention-days: 14
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest*.yml
